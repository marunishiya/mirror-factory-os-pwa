name: Comic Workbench QA (no deploy)
on:
  pull_request:
    paths:
      - 'labs/comic-workbench/**'
      - '.github/workflows/comic-workbench-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Node unit tests (no API credentials, no deployment)
        run: node --test labs/comic-workbench/engine.test.cjs
